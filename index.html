<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas TV – stream jako sled snímků</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>
  :root { --bg:#0e0f12; --panel:#17191e; --line:#2a2d35; --tx:#e8e8ea; --dim:#8b8f99; --acc:#ff5a36; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font:14px/1.4 system-ui, sans-serif; display:grid; grid-template-columns:300px 1fr; height:100vh; }
  aside { background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  aside h1 { font-size:16px; margin:14px 14px 4px; letter-spacing:.5px; }
  aside h1 span { color:var(--acc); }
  .sub { color:var(--dim); font-size:12px; margin:0 14px 10px; }
  .box { padding:10px 14px; border-top:1px solid var(--line); }
  label { display:block; font-size:12px; color:var(--dim); margin:6px 0 3px; }
  input[type=text], select { width:100%; background:#0f1115; color:var(--tx); border:1px solid var(--line); border-radius:6px; padding:7px 8px; font:inherit; }
  input[type=range] { width:100%; accent-color:var(--acc); }
  button { background:var(--acc); color:#fff; border:0; border-radius:6px; padding:7px 12px; font:inherit; font-weight:600; cursor:pointer; }
  button.ghost { background:#262931; }
  .row { display:flex; gap:6px; margin-top:6px; }
  .row > * { flex:1; }
  #list { flex:1; overflow:auto; min-height:0; }
  .ch { display:flex; align-items:center; gap:8px; padding:7px 14px; cursor:pointer; border-bottom:1px solid #1d2026; }
  .ch:hover { background:#1f2229; }
  .ch.on { background:#2b1d19; border-left:3px solid var(--acc); padding-left:11px; }
  .ch img { width:34px; height:22px; object-fit:contain; background:#fff1; border-radius:3px; }
  .ch small { color:var(--dim); display:block; font-size:11px; }
  main { position:relative; display:flex; flex-direction:column; min-width:0; }
  #stage { flex:1; display:flex; align-items:center; justify-content:center; background:#000; min-height:0; }
  canvas { max-width:100%; max-height:100%; image-rendering:auto; }
  #stats { display:flex; gap:18px; flex-wrap:wrap; padding:8px 14px; background:var(--panel); border-top:1px solid var(--line); font:12px ui-monospace, monospace; color:var(--dim); }
  #stats b { color:var(--tx); font-weight:600; }
  #msg { position:absolute; top:12px; left:50%; transform:translateX(-50%); background:#000c; padding:8px 14px; border-radius:6px; font-size:13px; display:none; max-width:80%; text-align:center; }
  video { display:none; }
  #ytBox { position:absolute; right:12px; bottom:52px; width:480px; max-width:60%; aspect-ratio:16/9; background:#000; border:1px solid var(--line); border-radius:6px; overflow:hidden; display:none; box-shadow:0 6px 24px #000a; }
  #ytBox iframe { width:100%; height:100%; border:0; display:block; }
  #ytTag { position:absolute; right:12px; bottom:calc(52px + min(270px, 60% * 9 / 16) + 4px); font-size:11px; color:var(--dim); display:none; }
  @media (max-width:760px){ body{grid-template-columns:1fr; grid-template-rows:auto 1fr; height:auto;} aside{max-height:50vh;} main{height:60vh;} }
</style>
</head>
<body>
<aside>
  <h1>CANVAS<span>TV</span></h1>
  <div class="sub">Video se nepřehrává jako video – každý snímek se vytáhne jako obrázek a vykreslí na &lt;canvas&gt;.</div>

  <div class="box">
    <label>Vlastní stream (.m3u8 / .mp4)</label>
    <input id="url" type="text" placeholder="https://…/playlist.m3u8">
    <div class="row"><button id="go">Přehrát</button><button id="stop" class="ghost">Stop</button></div>
  </div>

  <div class="box">
    <label>Můj server (odkaz z pracovního PC)</label>
    <input id="srv" type="text" placeholder="https://….trycloudflare.com/?key=…">
    <div class="row"><button id="srvGo" class="ghost">Připojit</button><span id="srvSt" style="align-self:center;font-size:12px;color:var(--dim)">nepřipojeno</span></div>
    <label style="display:flex;gap:6px;align-items:center"><input id="viaSrv" type="checkbox" checked> TV kanály posílat přes server</label>
  </div>

  <div class="box">
    <label>YouTube (odkaz nebo ID videa)</label>
    <input id="yt" type="text" placeholder="https://www.youtube.com/watch?v=…">
    <label>Testovací videa (klikni = spustí se)</label>
    <div id="ytTests"></div>
    <div class="row"><button id="ytCap" title="Vloží YouTube přehrávač a jeho obraz zachytává do canvasu">▶ Zachytit přehrávač</button></div>
    <div class="row"><button id="ytPiped" class="ghost" title="Zkusí získat přímý stream přes veřejné Piped servery">Přímý stream (Piped, test)</button></div>
  </div>

  <div class="box">
    <label>Snímků za sekundu: <b id="fpsv">25</b></label>
    <input id="fps" type="range" min="1" max="60" value="25">
    <label>Režim snímků</label>
    <select id="mode">
      <option value="jpeg">JPEG obrázky (enkód → dekód → kreslení)</option>
      <option value="bitmap">ImageBitmap (bez komprese)</option>
      <option value="direct">Přímé kreslení z videa</option>
    </select>
    <label>Kvalita JPEG: <b id="qv">0.70</b></label>
    <input id="q" type="range" min="0.05" max="1" step="0.05" value="0.7">
    <label>Rozlišení snímku: <b id="sv">100 %</b></label>
    <input id="scale" type="range" min="10" max="100" step="5" value="100">
    <div class="row"><button id="mute" class="ghost">🔇 Zvuk vyp.</button><button id="fs" class="ghost">⛶ Celá obr.</button></div>
  </div>

  <div class="box" style="padding-bottom:4px">
    <label>Česká TV (seznam iptv-org)</label>
    <input id="filter" type="text" placeholder="Hledat kanál…">
  </div>
  <div id="list"><div class="ch"><small>Načítám seznam kanálů…</small></div></div>
</aside>

<main>
  <div id="stage"><canvas id="cv" width="1280" height="720"></canvas></div>
  <div id="msg"></div>
  <div id="ytBox"></div>
  <div id="stats">
    <span>Kanál: <b id="sName">–</b></span>
    <span>Cíl: <b id="sTarget">25</b> fps</span>
    <span>Skutečně: <b id="sReal">0</b> fps</span>
    <span>Snímků: <b id="sCount">0</b></span>
    <span>Snímek: <b id="sRes">–</b></span>
    <span>Velikost JPEG: <b id="sSize">–</b></span>
  </div>
</main>

<video id="v" playsinline crossorigin="anonymous"></video>

<script>
/* ---------- můj server ---------- */
let SRV='', SKEY='';
function setSrv(link, save){
  try{ const u=new URL(link.trim()); SRV=u.origin; SKEY=u.searchParams.get('key')||''; }catch(e){ SRV=''; SKEY=''; }
  if(save){ try{ localStorage.setItem('ctvSrv', link.trim()); }catch(e){} }
}
function viaSrv(u){ return (SRV && document.getElementById('viaSrv').checked && !u.startsWith(SRV)) ? SRV+'/p?key='+SKEY+'&u='+encodeURIComponent(u) : u; }
async function pingSrv(){
  const st=document.getElementById('srvSt');
  if(!SRV){ st.textContent='nepřipojeno'; return false; }
  st.textContent='zkouším…';
  try{ const r=await fetch(SRV+'/ping?key='+SKEY); if(r.ok){ st.textContent='✅ připojeno'; st.style.color='#5c5'; return true; } st.textContent='❌ špatný klíč'; }
  catch(e){ st.textContent='❌ server neodpovídá'; }
  st.style.color='#f66'; return false;
}
async function ytServer(id){
  msg('Server stahuje informace o videu (může trvat 5–20 s)…', 0);
  try{
    const r=await fetch(SRV+'/yt?key='+SKEY+'&id='+id); const j=await r.json();
    if(!r.ok) throw new Error(j.error||r.status);
    play(SRV+j.path, j.title+' (server)'); return true;
  }catch(e){ msg('Server video nezískal: '+e.message, 9000); return false; }
}

const PLAYLIST = 'https://iptv-org.github.io/iptv/countries/cz.m3u';
const $ = id => document.getElementById(id);
const video = $('v'), cv = $('cv'), ctx = cv.getContext('2d');
const work = document.createElement('canvas'), wctx = work.getContext('2d');
let hls = null, channels = [], running = false, busy = false;
let lastT = 0, frames = 0, secFrames = 0, secT = performance.now();

const opt = { fps:25, mode:'jpeg', q:0.7, scale:1 };
$('fps').oninput = e => { opt.fps = +e.target.value; $('fpsv').textContent = opt.fps; $('sTarget').textContent = opt.fps; };
$('q').oninput = e => { opt.q = +e.target.value; $('qv').textContent = opt.q.toFixed(2); };
$('scale').oninput = e => { opt.scale = e.target.value/100; $('sv').textContent = e.target.value + ' %'; };
$('mode').onchange = e => { opt.mode = e.target.value; $('sSize').textContent = '–'; };

function msg(t, ms=4000){ const m=$('msg'); m.textContent=t; m.style.display='block'; clearTimeout(msg.t); if(ms) msg.t=setTimeout(()=>m.style.display='none',ms); }

/* ---------- seznam kanálů ---------- */
async function loadList(){
  try{
    const txt = await (await fetch(PLAYLIST)).text();
    const lines = txt.split(/\r?\n/);
    for(let i=0;i<lines.length;i++){
      if(!lines[i].startsWith('#EXTINF')) continue;
      const inf = lines[i];
      let j=i+1; while(j<lines.length && (lines[j].startsWith('#')||!lines[j].trim())) j++;
      const url = (lines[j]||'').trim(); if(!url) continue;
      channels.push({
        name: inf.split(',').slice(1).join(',').trim(),
        logo: (inf.match(/tvg-logo="([^"]*)"/)||[])[1]||'',
        group: (inf.match(/group-title="([^"]*)"/)||[])[1]||'',
        url
      });
    }
    renderList();
  }catch(e){ $('list').innerHTML='<div class="ch"><small>Seznam se nepodařilo načíst. Vlož URL streamu ručně.</small></div>'; }
}
function renderList(){
  const f = $('filter').value.toLowerCase();
  const L = $('list'); L.innerHTML='';
  channels.filter(c=>c.name.toLowerCase().includes(f)).forEach(c=>{
    const d=document.createElement('div'); d.className='ch';
    d.innerHTML = `${c.logo?`<img src="${c.logo}" onerror="this.style.visibility='hidden'">`:'<img>'}<div>${c.name}<small>${c.group||''}</small></div>`;
    d.onclick=()=>{ document.querySelectorAll('.ch.on').forEach(x=>x.classList.remove('on')); d.classList.add('on'); $('url').value=c.url; play(viaSrv(c.url),c.name); };
    L.appendChild(d);
  });
}
$('filter').oninput = renderList;

/* ---------- zdroj: skryté video ---------- */
let capStream = null, manualCrop = false;
function stop(){
  running=false; if(hls){hls.destroy(); hls=null;}
  if(capStream){ capStream.getTracks().forEach(t=>t.stop()); capStream=null; }
  manualCrop=false; video.srcObject=null;
  $('ytBox').style.display='none'; $('ytBox').innerHTML=''; $('ytBox').style.width=''; $('ytBox').style.maxWidth='';
  video.pause(); video.removeAttribute('src'); video.load();
}

/* ---------- YouTube ---------- */
function ytId(s){
  s=s.trim(); if(/^[\w-]{11}$/.test(s)) return s;
  const m=s.match(/(?:v=|youtu\.be\/|shorts\/|embed\/|live\/)([\w-]{11})/); return m?m[1]:null;
}
// A) zachytávání vloženého přehrávače (Chrome/Edge: Region Capture)
async function ytCapture(){
  const id=ytId($('yt').value); if(!id) return msg('Neplatný odkaz na YouTube.');
  stop(); $('sName').textContent='YouTube '+id;
  const box=$('ytBox'); box.style.display='block';
  box.innerHTML=`<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&mute=1&playsinline=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
  msg('V dialogu prohlížeče vyber TUTO kartu (Canvas TV) a potvrď sdílení.', 8000);
  try{
    capStream = await navigator.mediaDevices.getDisplayMedia({ video:{frameRate:60}, audio:false, preferCurrentTab:true, selfBrowserSurface:'include' });
    const track = capStream.getVideoTracks()[0];
    track.onended = ()=>{ if(capStream) stop(); };
    const surf = (track.getSettings && track.getSettings().displaySurface) || '';
    let cropped = false;
    if(window.CropTarget && track.cropTo){
      try{ await track.cropTo(await CropTarget.fromElement(box)); cropped = true; }catch(e){ console.warn('cropTo', e); }
    }
    if(!cropped){
      if(surf && surf!=='browser'){ throw Object.assign(new Error('Vybráno „'+surf+'“ místo karty – vyber kartu Canvas TV.'),{name:'WrongSurface'}); }
      manualCrop = true;   // ořez ručně podle pozice přehrávače
    }
    video.srcObject = capStream; muted=true; updMute();
    await video.play(); running=true; requestAnimationFrame(loop);
    msg('Zvuk hraje přímo YouTube přehrávač (vpravo dole – v něm ho zapni).', 6000);
  }catch(e){
    console.warn('capture', e);
    const why = e.name==='NotAllowedError' ? 'zrušeno nebo zakázáno' : (e.message || e.name);
    stop();
    if(e.name==='WrongSurface'){ msg(e.message, 8000); return; }
    msg('Zachytávání nevyšlo ('+why+'). Zkouším přímý stream…', 0);
    if(await ytPiped()===false) ytFallback(id, 'Zachytávání ani přímý stream nevyšly ('+why+').');
  }
}
// B) přímý stream přes veřejné Piped API (servery se mění, nemusí fungovat)
const PIPED=['https://pipedapi.kavin.rocks','https://pipedapi.adminforge.de','https://api.piped.private.coffee','https://pipedapi.r4fo.com'];
async function ytPiped(){
  const id=ytId($('yt').value); if(!id) return msg('Neplatný odkaz na YouTube.');
  msg('Hledám funkční server pro přímý stream…', 0);
  for(const api of PIPED){
    try{
      const ctl=new AbortController(); setTimeout(()=>ctl.abort(),6000);
      const d=await (await fetch(`${api}/streams/${id}`,{signal:ctl.signal})).json();
      const mp4=(d.videoStreams||[]).filter(s=>!s.videoOnly && s.url).sort((a,b)=>(b.height||0)-(a.height||0))[0];
      const url=d.hls || (mp4 && mp4.url);
      if(url){ play(url,(d.title||'YouTube')+' (Piped)'); return; }
    }catch(e){}
  }
  // Invidious (local=true = video jde přes server instance, s CORS)
  for(const api of INVID){
    try{
      const ctl=new AbortController(); setTimeout(()=>ctl.abort(),6000);
      const d=await (await fetch(`${api}/api/v1/videos/${id}?local=true`,{signal:ctl.signal})).json();
      const f=(d.formatStreams||[]).filter(s=>s.url).sort((a,b)=>parseInt(b.resolution||0)-parseInt(a.resolution||0))[0];
      if(f){ play(f.url.startsWith('http')?f.url:api+f.url,(d.title||'YouTube')+' (Invidious)'); return; }
    }catch(e){}
  }
  return false;
}
const INVID=['https://inv.nadeko.net','https://yewtu.be','https://invidious.nerdvpn.de','https://invidious.f5.si'];
const canCapture = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia && window.CropTarget) && !/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
async function ytAuto(){
  const id=ytId($('yt').value); if(!id) return msg('Neplatný odkaz na YouTube.');
  if(SRV){ stop(); if(await ytServer(id)) return; }
  if(canCapture) return ytCapture();
  if(await ytPiped()===false) ytFallback(id, 'Přímý stream se nepodařilo získat.');
}
function ytFallback(id, why){
  {
    // poslední záchrana: obyčejný přehrávač (bez canvasu)
    stop(); $('sName').textContent='YouTube '+id+' (bez canvasu)';
    const box=$('ytBox'); box.style.display='block'; box.style.width='calc(100% - 24px)'; box.style.maxWidth='none';
    box.innerHTML=`<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
    msg(why+' Hraje normální YouTube přehrávač (ne přes canvas).', 9000);
  }
}
$('ytCap').onclick=ytAuto;
$('ytPiped').onclick=async()=>{ if(await ytPiped()===false) msg('Žádný server pro přímý stream teď neodpověděl.',7000); };
$('ytCap').textContent='▶ Přehrát';
$('srvGo').onclick=()=>{ setSrv($('srv').value,true); pingSrv(); };
{ const p=new URLSearchParams(location.search);
  let link = (p.get('key') && /trycloudflare\.com$|^localhost$/.test(location.hostname)) ? location.origin+'/?key='+p.get('key') : '';
  if(!link){ try{ link=localStorage.getItem('ctvSrv')||''; }catch(e){} }
  if(link){ $('srv').value=link; setSrv(link, !!p.get('key')); pingSrv(); } }
const YT_TESTS=[
  ['Jak začala druhá světová válka (dokument)','https://www.youtube.com/watch?v=npMCckuphTg'],
  ['Druhá světová válka z pohledu Hitlera','https://www.youtube.com/watch?v=h7C26H8ym1w'],
  ['Válečné vlaky ve II. světové válce – 1. část','https://www.youtube.com/watch?v=WNlF4jJdu7o'],
];
YT_TESTS.forEach(([n,u])=>{
  const b=document.createElement('div'); b.className='ch'; b.style.padding='6px 4px'; b.innerHTML='▶ '+n;
  b.onclick=()=>{ $('yt').value=u; ytAuto(); };
  $('ytTests').appendChild(b);
});
function play(url, name){
  stop(); $('sName').textContent = name || url.split('/').pop();
  msg('Připojuji stream…', 0);
  if(url.includes('.m3u8') && window.Hls && Hls.isSupported()){
    hls = new Hls({ lowLatencyMode:true });
    hls.loadSource(url); hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, start);
    hls.on(Hls.Events.ERROR, (_,d)=>{ if(d.fatal){ msg('Stream nejde načíst ('+d.details+'). Často kvůli CORS nebo geoblokaci.', 7000); stop(); } });
  } else {
    video.crossOrigin='anonymous'; video.src = url;
    video.addEventListener('loadedmetadata', start, {once:true});
    video.onerror = ()=>{
      if(video.crossOrigin){ // server nepovoluje CORS → zkusit bez něj (JPEG režim pak nejde)
        video.removeAttribute('crossorigin'); video.src=url;
        video.addEventListener('loadedmetadata', start, {once:true});
      } else msg('Stream nejde načíst.', 6000);
    };
  }
}
function start(){
  video.muted = muted;
  video.play().then(()=>{ $('msg').style.display='none'; running=true; requestAnimationFrame(loop); })
    .catch(()=>{ video.muted=true; muted=true; updMute(); video.play().then(()=>{running=true; requestAnimationFrame(loop);}); });
}

/* ---------- smyčka: snímek → obrázek → canvas ---------- */
async function loop(t){
  if(!running) return;
  requestAnimationFrame(loop);
  if(busy || t - lastT < 1000/opt.fps || video.readyState < 2) return;
  lastT = t; busy = true;
  try{
    if(!video.videoWidth) return;
    let sx=0, sy=0, vw=video.videoWidth, vh=video.videoHeight;
    if(manualCrop){
      const r=$('ytBox').getBoundingClientRect(), k=video.videoWidth/window.innerWidth;
      sx=Math.round(r.left*k); sy=Math.round(r.top*k); vw=Math.round(r.width*k); vh=Math.round(r.height*k);
    }
    const w=Math.max(16,Math.round(vw*opt.scale)), h=Math.max(9,Math.round(vh*opt.scale));
    if(cv.width!==vw||cv.height!==vh){ cv.width=vw; cv.height=vh; }
    $('sRes').textContent = w+'×'+h;
    ctx.imageSmoothingEnabled = opt.scale > .5;

    if(opt.mode==='direct'){
      ctx.drawImage(video,sx,sy,vw,vh,0,0,vw,vh);
    } else if(opt.mode==='bitmap'){
      const bmp = await createImageBitmap(video,sx,sy,vw,vh,{resizeWidth:w,resizeHeight:h});
      ctx.drawImage(bmp,0,0,vw,vh); bmp.close();
    } else {
      if(work.width!==w||work.height!==h){ work.width=w; work.height=h; }
      wctx.drawImage(video,sx,sy,vw,vh,0,0,w,h);
      const blob = await new Promise(r=>work.toBlob(r,'image/jpeg',opt.q));
      if(blob){
        $('sSize').textContent = (blob.size/1024).toFixed(1)+' kB';
        const img = await createImageBitmap(blob);
        ctx.drawImage(img,0,0,vw,vh); img.close();
      }
    }
    frames++; secFrames++;
    $('sCount').textContent = frames;
    if(t-secT>=1000){ $('sReal').textContent=(secFrames*1000/(t-secT)).toFixed(1); secFrames=0; secT=t; }
  }catch(e){
    if(e && e.name==='SecurityError' && opt.mode!=='direct'){
      opt.mode='direct'; $('mode').value='direct';
      msg('Tento zdroj nepovoluje převod na JPEG – přepnuto na přímé kreslení.', 6000);
    } else console.warn(e);
  }
  finally{ busy=false; }
}

/* ---------- ovládání ---------- */
let muted = true;
function updMute(){ $('mute').textContent = muted ? '🔇 Zvuk vyp.' : '🔊 Zvuk zap.'; }
$('mute').onclick = ()=>{ muted=!muted; video.muted=muted; updMute(); };
$('go').onclick = ()=>{ const u=$('url').value.trim(); if(!u) return; const id=ytId(u); if(id && SRV && /youtu/.test(u)) return ytServer(id); play(viaSrv(u)); };
$('stop').onclick = ()=>{ stop(); $('sName').textContent='–'; };
$('fs').onclick = ()=>{ (cv.requestFullscreen||cv.webkitRequestFullscreen).call(cv); };
cv.ondblclick = ()=>$('fs').click();

// úvodní obrazovka
ctx.fillStyle='#000'; ctx.fillRect(0,0,cv.width,cv.height);
ctx.fillStyle='#555'; ctx.font='28px system-ui'; ctx.textAlign='center';
ctx.fillText('Vyber kanál vlevo', cv.width/2, cv.height/2);
loadList();
</script>
</body>
</html>
